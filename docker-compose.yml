version: '3.8'

services:
  flask_app:
    build: .
    ports:
      # Map local port 5000 directly to container port 5000
      - "5000:5000"
    environment:
      # Force it to use 5000 locally
      - PORT=5000
      # YOUR AI KEY GOES HERE so the bot doesn't crash locally
      - 
      # Database connection
      - DATABASE_URL=postgresql://postgres:postgres@flask_db:5432/postgres
    depends_on:
      - flask_db

  flask_db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
